# PR para main      -> fmt + init + validate + plan   (nunca aplica)
# push na main      -> apply -auto-approve
# workflow_dispatch -> plan | apply | destroy

name: Terraform - Infra DB (RDS PostgreSQL)

# PR ou merge que só mexe em documentação não roda Terraform. Sem este filtro, corrigir um README
# exige a sessão do lab de pé: o `plan` do PR falha sem o contrato do repo 2 no SSM, e o merge
# dispara um `apply`. O `workflow_dispatch` abaixo continua alcançando plan/apply/destroy.
# ⚠️ O filtro é tudo-ou-nada: um único arquivo fora de `**.md` no PR faz o workflow rodar normalmente.
on:
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**.md" ]
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md" ]
  workflow_dispatch:
    inputs:
      action:
        description: "O que executar"
        type: choice
        required: true
        default: plan
        options: [ plan, apply, destroy ]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Sem isto o token expirado do lab (~4h) só aparece no plan, como ExpiredToken no meio do output.
      - name: Check lab session
        run: |
          if ! aws sts get-caller-identity > /dev/null; then
            echo "::error::Credencial do AWS Academy expirou (a sessao dura ~4h)."
            echo "::error::Abra o lab, atualize ~/.aws/credentials e rode o refresh-gh-secrets.ps1 do repo infra-k8s."
            exit 1
          fi
          aws sts get-caller-identity

      - name: Check repo 2 contract (SSM)
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        run: |
          missing=0
          for p in /fase3/vpc/id /fase3/vpc/private-subnets /fase3/eks/node-sg-id; do
            if ! aws ssm get-parameter --name "$p" > /dev/null 2>&1; then
              echo "::error::Parametro ausente no SSM: $p"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::A rede vem do repo fiap-fase3-infra-k8s. Aplique-o primeiro (ordem 2 -> 3 -> 4 -> 1)."
            exit 1
          fi

      # Mesmo check, outra mensagem: no destroy, parâmetro ausente significa que o repo 2 já caiu, e
      # mandar "aplique o repo 2 primeiro" para quem está derrubando o 3 induz a subir infra cara.
      - name: Check contract on destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: |
          for p in /fase3/vpc/id /fase3/vpc/private-subnets /fase3/eks/node-sg-id; do
            if ! aws ssm get-parameter --name "$p" > /dev/null 2>&1; then
              echo "::error::$p nao existe mais — o repo 2 ja foi destruido e o destroy daqui falha ao ler os data sources."
              echo "::error::NAO rode apply. Siga 'Recuperacao: repo 2 destruido antes do repo 3' no README."
              exit 1
            fi
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra-db/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        run: |
          terraform plan -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan"
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Show outputs
        if: success() && github.event_name != 'pull_request'
        run: terraform output || true
